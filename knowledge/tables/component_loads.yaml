# Load cases and sizing constants for the secondary structural components (horizontal tail spar,
# main landing gear). Read by spiral/tools/tail.py and spiral/tools/landing_gear.py.
# Page numbers: Raymer, Aircraft Design: A Conceptual Approach, 2nd ed. (AIAA, 1992), 2nd printing.
# `verified: false` on every row: each was read off the scanned page by Tharm's agent, not yet
# confirmed by the extract_knowledge.py critic. Run `scripts/extract_knowledge.py check` to stamp them.

ga_single_engine:
  maneuver_speed:
    # V_p = V_s + K_p (V_L - V_s), K_p = 0.15 + 5400 / (W + 3300), W in lb
    kp_constant: 0.15
    kp_numerator_lb: 5400.0
    kp_offset_lb: 3300.0
    kp_min: 0.5
    kp_max: 1.0
    kp_max_general_aviation: 0.9
    source: "Raymer 2ed, Eqs. 14.12-14.13 (p. 345)"
    verified: false
  tail_normal_force_coefficients:
    # Arbitrary tail loads at manoeuvre speed, spanwise load proportional to chord
    horizontal_down: -0.55
    horizontal_up: 0.35
    vertical: 0.45
    source: "Raymer 2ed, Sec. 14.3 (p. 347)"
    verified: false
  tail_thickness_ratio:
    note: "Tail thickness ratio is usually similar to the wing thickness ratio"
    source: "Raymer 2ed, Sec. 4.6 (p. 76)"
    verified: false
  tail_planform_ranges:
    # Table 4.3, row "Others", horizontal tail
    aspect_ratio_min: 3.0
    aspect_ratio_max: 5.0
    taper_ratio_min: 0.3
    taper_ratio_max: 0.6
    source: "Raymer 2ed, Table 4.3 (p. 76)"
    verified: false
  landing_sink_speed:
    ft_per_s: 10.0
    note: "Most aircraft require 10 ft/s vertical velocity capability"
    source: "Raymer 2ed, Sec. 11.4 (p. 242)"
    verified: false
  gear_load_factor:
    n_gear: 3.0
    note: "Table 11.5, row General aviation"
    source: "Raymer 2ed, Table 11.5 (p. 243)"
    verified: false
  shock_absorber_efficiency:
    # Table 11.4: oleopneumatic fixed orifice 0.65-0.80; the low end gives the longer (conservative) stroke
    oleo_fixed_orifice_min: 0.65
    oleo_fixed_orifice_max: 0.80
    source: "Raymer 2ed, Table 11.4 (p. 242)"
    verified: false
  stroke_rules:
    margin_in: 1.0
    minimum_in: 8.0
    oleo_length_to_stroke: 2.5
    note: "Add about 1 in to Eq. 11.12; 8 in minimum stroke; oleo length about 2.5 x stroke"
    source: "Raymer 2ed, Sec. 11.4 (p. 244)"
    verified: false
  oleo_diameter:
    # D_oleo = 1.3 sqrt(4 L / (P pi)) ~= 0.04 sqrt(L), D in in, L in lb, P = 1800 psi
    coefficient: 0.04
    internal_pressure_psi: 1800.0
    source: "Raymer 2ed, Eq. 11.13 (p. 244)"
    verified: false
  main_gear_load_share:
    # Nose wheel carries 8-15% of the weight (most-aft to most-forward c.g.); the mains carry the rest.
    nose_share_most_aft_cg: 0.08
    main_struts: 2
    source: "Raymer 2ed, Sec. 11.2 (p. 233); two main oleos (p. 244)"
    verified: false
