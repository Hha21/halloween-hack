# Curated Equation Registry (Owner: Tharm)
# Every deterministic tool in spiral/tools/ cites an entry from this registry.

equations:
  weight_closure:
    name: "Iterative Takeoff Gross Weight Closure"
    latex: "W_0 = \\frac{W_{\\text{crew}} + W_{\\text{payload}}}{1 - (W_f / W_0) - (W_e / W_0)}"
    source: "Raymer 6ed, Ch. 3, Eq. 3.4 (p. 25)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  empty_weight_fraction_ga:
    name: "Statistical Empty Weight Fraction (GA Single-Engine)"
    latex: "\\frac{W_e}{W_0} = A \\cdot W_0^C \\quad (A = 2.36, C = -0.18)"
    source: "Raymer 6ed, Ch. 3, Table 3.1 (p. 26)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  breguet_range_prop:
    name: "Breguet Cruise Fuel Fraction (Propeller)"
    latex: "\\frac{W_i}{W_{i-1}} = \\exp\\left(-\\frac{R \\cdot c_{\\text{bhp}} \\cdot g}{\\eta_p \\cdot (L/D)}\\right)"
    source: "Raymer 6ed, Ch. 3, Eq. 3.7 (p. 29)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  loiter_endurance_prop:
    name: "Propeller Loiter Endurance Fuel Fraction"
    latex: "\\frac{W_i}{W_{i-1}} = \\exp\\left(-\\frac{E \\cdot V \\cdot c_{\\text{bhp}} \\cdot g}{\\eta_p \\cdot (L/D)}\\right)"
    source: "Raymer 6ed, Ch. 3, Eq. 3.8 (p. 30)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  stall_wing_loading:
    name: "Stall Speed Wing Loading Limit"
    latex: "\\frac{W}{S} = \\frac{1}{2} \\rho V_{\\text{stall}}^2 C_{L,\\max}"
    source: "Raymer 6ed, Ch. 5, Eq. 5.6 (p. 95)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  schrenk_lift_distribution:
    name: "Schrenk Spanwise Lift Approximation"
    latex: "L'(y) = \\frac{1}{2} \\left( L'_{\\text{elliptical}}(y) + L'_{\\text{planform}}(y) \\right)"
    source: "Schrenk (1940) NACA TM 948; Raymer 6ed Ch. 14"
    tool: "spiral.tools.spar.spar_loads"
    verified: true

  ibeam_cap_sizing:
    name: "I-Beam Spar Cap Area and Web Shear Sizing"
    latex: "A_{\\text{cap}}(y) = \\frac{M(y)}{h(y) \\cdot \\sigma_{\\text{allow}}}, \\quad t_{\\text{web}}(y) = \\frac{V(y)}{h(y) \\cdot \\tau_{\\text{allow}}}"
    source: "Megson, Aircraft Structures for Engineering Students, Ch. 9"
    tool: "spiral.tools.spar.size_spar"
    verified: true
