# Curated equation registry (Owner: Harry).
# Every deterministic tool in spiral/tools/ cites an entry from this registry. Page numbers are for
# Raymer, Aircraft Design: A Conceptual Approach, 2nd ed. (AIAA, 1992). `verified` is set by
# `python scripts/extract_knowledge.py check --write` only when the critic confirmed the printed equation.
# The LaTeX here is the form the code uses (SI); the book prints imperial forms.

equations:
  weight_closure:
    name: "Take-off gross weight sizing equation"
    latex: "W_0 = \\frac{W_{\\text{crew}} + W_{\\text{payload}}}{1 - (W_f / W_0) - (W_e / W_0)}"
    source: "Raymer 2ed, Eq. 3.4 (p. 12)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  empty_weight_fraction_ga:
    name: "Statistical empty-weight fraction (GA single engine)"
    latex: "\\frac{W_e}{W_0} = A \\cdot W_0^C \\quad (A = 2.36, C = -0.18, W_0 \\text{ in lb})"
    source: "Raymer 2ed, Table 3.1 (p. 13)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  breguet_range_prop:
    name: "Breguet cruise weight fraction (propeller, SI form)"
    latex: "\\frac{W_i}{W_{i-1}} = \\exp\\left(-\\frac{R \\cdot \\text{bsfc} \\cdot g}{\\eta_p \\cdot (L/D)}\\right)"
    source: "Raymer 2ed, Eq. 3.6 (p. 17)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  prop_equivalent_sfc:
    name: "Propeller equivalent thrust SFC"
    latex: "C = C_{\\text{bhp}} \\frac{V}{550 \\eta_p}"
    source: "Raymer 2ed, Eq. 3.10 (p. 18)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  loiter_endurance_prop:
    name: "Loiter weight fraction (propeller, SI form)"
    latex: "\\frac{W_i}{W_{i-1}} = \\exp\\left(-\\frac{E \\cdot V \\cdot \\text{bsfc} \\cdot g}{\\eta_p \\cdot (L/D)}\\right)"
    source: "Raymer 2ed, Eq. 3.8 (p. 17)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  fuel_fraction_allowance:
    name: "Total fuel fraction with 6% reserve and trapped fuel"
    latex: "\\frac{W_f}{W_0} = 1.06 \\left(1 - \\frac{W_x}{W_0}\\right)"
    source: "Raymer 2ed, Eq. 3.11 (p. 23)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  stall_wing_loading:
    name: "Stall-speed wing loading"
    latex: "\\frac{W}{S} = \\frac{1}{2} \\rho V_{\\text{stall}}^2 C_{L,\\max}"
    source: "Raymer 2ed, Eq. 5.6 (p. 85)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  cruise_thrust_matching:
    name: "Cruise thrust-to-weight equals 1/(L/D)"
    latex: "\\left(\\frac{T}{W}\\right)_{\\text{cruise}} = \\frac{1}{(L/D)_{\\text{cruise}}}"
    source: "Raymer 2ed, Eq. 5.2 (p. 81)"
    tool: "spiral.tools.sizing.conceptual_sizing"
    verified: true

  schrenk_lift_distribution:
    name: "Schrenk spanwise lift approximation"
    latex: "L'(y) = \\frac{1}{2} \\left( L'_{\\text{elliptical}}(y) + L'_{\\text{planform}}(y) \\right)"
    source: "Raymer 2ed, Fig. 14.10 (p. 343)"
    tool: "spiral.tools.spar.spar_loads"
    verified: true

  beam_bending_stress:
    name: "Beam bending stress"
    latex: "\\sigma_x = \\frac{M z}{I_y}"
    source: "Raymer 2ed, Eq. 14.35 (p. 383)"
    tool: "spiral.tools.spar.size_spar"
    verified: true

  beam_shear_stress:
    name: "Beam shear stress"
    latex: "\\tau = \\frac{V}{b I_y} \\int_{z_1}^{h/2} z \\, dA"
    source: "Raymer 2ed, Eq. 14.36 (p. 384)"
    tool: "spiral.tools.spar.size_spar"
    verified: true

  ibeam_cap_sizing:
    name: "I-beam spar cap area and web shear sizing (idealised: caps carry bending, web carries shear)"
    latex: "A_{\\text{cap}}(y) = \\frac{M(y)}{h(y) \\cdot \\sigma_{\\text{allow}}}, \\quad t_{\\text{web}}(y) = \\frac{V(y)}{h(y) \\cdot \\tau_{\\text{allow}}}"
    source: "Derived from Raymer 2ed, Eqs. 14.35-14.36 (pp. 383-384) for an idealised two-cap beam"
    tool: "spiral.tools.spar.size_spar"
    verified: false

  web_shear_buckling:
    name: "Shear buckling stress of a flat web panel"
    latex: "F_{\\text{shear buckle}} = K E \\left(\\frac{t}{b}\\right)^2"
    source: "Raymer 2ed, Eq. 14.37 (p. 385)"
    tool: "spiral.tools.spar.size_spar"
    verified: true

  maneuver_speed:
    name: "Manoeuvre (pull-up) speed"
    latex: "V_p = V_s + K_p (V_L - V_s), \\quad K_p = 0.15 + \\frac{5400}{W + 3300}"
    source: "Raymer 2ed, Eqs. 14.12-14.13 (p. 345)"
    tool: "spiral.tools.tail.horizontal_tail_spar"
    verified: false

  tail_normal_force_load:
    name: "Arbitrary horizontal-tail load at manoeuvre speed, spanwise proportional to chord"
    latex: "P_{\\text{tail}} = |C_n| \\, q_p \\, S_{HT}, \\quad w(y) = \\frac{P_{\\text{tail}}}{S_{HT}} c(y)"
    source: "Raymer 2ed, Sec. 14.3 (p. 347)"
    tool: "spiral.tools.tail.horizontal_tail_spar"
    verified: false

  shock_absorber_stroke:
    name: "Shock-absorber stroke"
    latex: "S = \\frac{V_{\\text{vertical}}^2}{2 g \\eta N_{\\text{gear}}} - \\frac{\\eta_T}{\\eta} S_T"
    source: "Raymer 2ed, Eq. 11.12 (p. 243)"
    tool: "spiral.tools.landing_gear.size_main_landing_gear"
    verified: false

  oleo_diameter:
    name: "Oleo external diameter"
    latex: "D_{\\text{oleo}} = 1.3 \\sqrt{\\frac{4 L_{\\text{oleo}}}{P \\pi}} \\approx 0.04 \\sqrt{L_{\\text{oleo}}}"
    source: "Raymer 2ed, Eq. 11.13 (p. 244)"
    tool: "spiral.tools.landing_gear.size_main_landing_gear"
    verified: false

  gear_leg_landing_load:
    name: "Landing load per main gear leg (two legs)"
    latex: "F_s = W N_{\\text{gear}} / 2"
    source: "Raymer 2ed, Eq. 11.14 (p. 245)"
    tool: "spiral.tools.landing_gear.size_main_landing_gear"
    verified: false

  vertical_kinetic_energy:
    name: "Vertical kinetic energy at touchdown"
    latex: "KE_{\\text{vertical}} = \\frac{1}{2} \\frac{W_{\\text{landing}}}{g} V_{\\text{vertical}}^2"
    source: "Raymer 2ed, Eq. 11.8 (p. 242)"
    tool: "spiral.tools.landing_gear.size_main_landing_gear"
    verified: false
